name: Clashfinder sync (All Together Now)

env:
  FESTIVAL_YEAR: 2027
  FESTIVAL_YEAR_DEBUG: 2026 # TODO
  FESTIVAL_DATA_PATH: festivals/alltogethernow
  CLASHFINDER_NAME: atn2027

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "festivals/alltogethernow/2026/clashfinder.txt"   # TODO
  workflow_run:
    workflows:
      - All Together Now schedule updates
    types:
      - completed
    branches:
      - "main"

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        ref: main
        fetch-depth: 0
    - name: Check whether Clashfinder data changed
      id: clashfinder_data
      run: |
        clashfinder_path="${FESTIVAL_DATA_PATH}/${FESTIVAL_YEAR_DEBUG}/clashfinder.txt"

        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "changed=true" >> "${GITHUB_OUTPUT}"
        elif [[ "${{ github.event_name }}" == "push" ]]; then
          before="${{ github.event.before }}"
          if [[ "${before}" =~ ^0+$ ]] || ! git rev-parse --verify --quiet "${before}^{commit}"; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          elif git diff --quiet "${before}" HEAD -- "${clashfinder_path}"; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi
        elif git rev-parse --verify --quiet HEAD^; then
          if git diff --quiet HEAD^ HEAD -- "${clashfinder_path}"; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi
        else
          echo "changed=true" >> "${GITHUB_OUTPUT}"
        fi
    - name: Install uv
      if: steps.clashfinder_data.outputs.changed == 'true'
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Install the project
      if: steps.clashfinder_data.outputs.changed == 'true'
      run: uv sync --locked --all-extras --dev
    - name: Debug - probe clashfinder.com connectivity
      if: steps.clashfinder_data.outputs.changed == 'true'
      run: |
        echo "Runner egress IP:"
        curl -sS --max-time 10 https://ifconfig.me || echo "(ifconfig.me lookup failed)"
        echo
        echo "--- HEAD https://clashfinder.com/ ---"
        curl -sS --max-time 15 -D - -o /dev/null -w "\nHTTP status: %{http_code}\nConnect time: %{time_connect}s\nTotal time: %{time_total}s\n" https://clashfinder.com/ || echo "(request failed/timed out)"
        echo
        echo "--- HEAD https://clashfinder.com/l/${CLASHFINDER_NAME}/?revs (unauthenticated) ---"
        curl -sS --max-time 15 -D - -o /dev/null -w "\nHTTP status: %{http_code}\nTotal time: %{time_total}s\n" "https://clashfinder.com/l/${CLASHFINDER_NAME}/?revs" || echo "(request failed/timed out)"
    - name: Upload Clashfinder data
      if: steps.clashfinder_data.outputs.changed == 'true'
      env:
        CLASHFINDER_COOKIE_BASE64: ${{ secrets.CLASHFINDER_COOKIE_BASE64 }}
      run: |
        CLASHFINDER_COOKIE="$(printf '%s' "${CLASHFINDER_COOKIE_BASE64}" | base64 -d)"
        echo "::add-mask::${CLASHFINDER_COOKIE}"
        export CLASHFINDER_COOKIE
        uv run ./bin/clashfinder.py \
          --name "${CLASHFINDER_NAME}" \
          --path "${FESTIVAL_DATA_PATH}/${FESTIVAL_YEAR_DEBUG}/clashfinder.txt"
